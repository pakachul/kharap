<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Authorized Video Player</title>
<style>body{background:#10131a;color:white;font:16px system-ui;max-width:1000px;margin:30px auto;padding:16px}video{width:100%;aspect-ratio:16/9;background:black}</style>
<h1 id="title">Video</h1><video id="v" controls playsinline></video><p id="msg">Pass a direct authorized MP4 URL using ?src=...</p>
<script>let q=new URLSearchParams(location.search);if(q.get('id'))document.getElementById('title').textContent=q.get('id');let s=q.get('src');if(s){try{let u=new URL(s);if(!['https:','http:'].includes(u.protocol))throw Error();document.getElementById('v').src=u.href;document.getElementById('msg').textContent='Source loaded'}catch(e){document.getElementById('msg').textContent='Invalid video URL'}}</script></html>
