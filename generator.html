<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>XML Base64 Generator</title>
<style>body{font:16px system-ui;max-width:850px;margin:30px auto;padding:0 16px;background:#f4f6f8}main{background:white;padding:22px;border-radius:12px}label{display:block;margin:14px 0 5px;font-weight:bold}input,textarea{box-sizing:border-box;width:100%;padding:10px;font:14px monospace}textarea{height:140px}button{padding:10px 16px;margin-top:12px;cursor:pointer}.out{overflow-wrap:anywhere;background:#eef2f7;padding:12px;margin-top:15px}</style>
<main><h1>XML Base64 URL Generator</h1>
<label>Player page URL</label><input id="page" placeholder="https://example.com/player.html">
<label>Post ID</label><input id="pid" placeholder="video-example">
<label>XML</label><textarea id="xml"><krpano>
  <include url="https://YOUR-USERNAME.github.io/my-player-config/config.xml"/>
</krpano></textarea>
<button id="go">Generate</button><div class="out"><b>Base64</b><p id="b64"></p><button onclick="copy('b64')">Copy Base64</button></div>
<div class="out"><b>Generated URL</b><p id="url"></p><button onclick="copy('url')">Copy URL</button></div>
<p>Base64 is not encryption. Publish only content you are authorized to use.</main>
<script>
function enc(s){let b=new TextEncoder().encode(s), x="";b.forEach(v=>x+=String.fromCharCode(v));return btoa(x)}
document.getElementById('go').onclick=()=>{try{let p=document.getElementById('page').value.trim();if(!p)throw Error('Enter player page URL');let u=new URL(p);let b=enc(document.getElementById('xml').value);u.searchParams.set('xml','data:application/xml;base64,'+b);u.searchParams.set('id',document.getElementById('pid').value.trim()||'video-example');document.getElementById('b64').textContent=b;document.getElementById('url').textContent=u.href}catch(e){alert(e.message)}};
function copy(id){navigator.clipboard.writeText(document.getElementById(id).textContent)}
</script></main></html>
